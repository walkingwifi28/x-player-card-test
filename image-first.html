<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Interactive Video</title>

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Interactive Video">
  <meta name="twitter:description" content="サムネイルからインタラクティブ動画を開くテスト">
  <meta name="twitter:image" content="https://walkingwifi28.github.io/x-player-card-test/thumbnail-v2.png">
  <meta name="twitter:image:alt" content="Interactive Video thumbnail">

  <meta property="og:title" content="Interactive Video">
  <meta property="og:description" content="サムネイルからインタラクティブ動画を開くテスト">
  <meta property="og:image" content="https://walkingwifi28.github.io/x-player-card-test/thumbnail-v2.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta property="og:type" content="website">

  <style>
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; background:#000; color:#fff; font-family:system-ui,-apple-system,sans-serif; }
    .player { position:relative; width:100%; min-height:100vh; overflow:hidden; background:#000; }
    video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
    .status {
      position:absolute; top:18px; left:50%; transform:translateX(-50%);
      padding:10px 16px; border-radius:8px; background:rgba(0,0,0,.78);
      font-weight:700; white-space:nowrap;
    }
    .choices {
      position:absolute; left:0; right:0; bottom:28px;
      display:flex; justify-content:center; gap:14px; padding:0 16px;
    }
    button {
      appearance:none; border:1px solid rgba(255,255,255,.4);
      background:rgba(0,0,0,.82); color:#fff; padding:14px 24px;
      border-radius:10px; font-size:18px; font-weight:700; cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="player">
    <video id="video" src="./sample.mp4" poster="./thumbnail-v2.png" controls playsinline muted loop></video>
    <div id="status" class="status">ボタンを押してください</div>
    <div class="choices">
      <button type="button" data-choice="A">Aを選択</button>
      <button type="button" data-choice="B">Bを選択</button>
    </div>
  </div>

  <script>
    const status = document.getElementById("status");
    const video = document.getElementById("video");

    document.querySelectorAll("[data-choice]").forEach((button) => {
      button.addEventListener("click", () => {
        const choice = button.dataset.choice;
        status.textContent = `${choice} が選択されました`;
        video.currentTime = choice === "A" ? 1 : 3;
        video.play().catch(() => {});
        console.log("interactive-choice", choice);
      });
    });
  </script>
</body>
</html>
